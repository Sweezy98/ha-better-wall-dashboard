<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Better Lighting's header, element for element: the same grid, glows,
     badge, title, chips and bottom strip. What changes is what is drawn --
     a wall tablet instead of a room -- and nothing on it is data: no time,
     no date, no names. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #060b10;
    font-family: Inter, system-ui, sans-serif;
    color: #e9f2f8;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,190,230,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,190,230,.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .glow.warm { width: 620px; height: 620px; right: -120px; top: -80px;
               background: radial-gradient(circle, rgba(255,176,60,.30), transparent 65%); }
  .glow.cool { width: 560px; height: 560px; left: -160px; bottom: -200px;
               background: radial-gradient(circle, rgba(60,170,255,.20), transparent 65%); }

  .left { position: absolute; left: 64px; top: 44px; width: 620px; }
  .badge { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .mark {
    width: 54px; height: 54px; border-radius: 16px;
    border: 1.5px solid rgba(120,200,255,.45);
    background: rgba(20,40,58,.7);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 26px rgba(80,180,255,.28);
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .22em;
    color: #8fb6cc; text-transform: uppercase; display: flex; align-items: center; gap: 10px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #54c8ff; box-shadow: 0 0 10px #54c8ff; }

  h1 { font-size: 60px; font-weight: 800; letter-spacing: -.022em; line-height: 1.03; }
  h1 .warm { color: #ffb43c; }
  .tag { margin-top: 16px; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #cfe3ef; letter-spacing: .01em; }
  .sub { margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #7f9fb2; letter-spacing: .04em; }
  .chips { margin-top: 22px; display: flex; gap: 12px; }
  .chip {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    padding: 8px 18px; border-radius: 999px;
    border: 1px solid rgba(120,200,255,.32); color: #9fd2ef;
  }
  .chip.amber { border-color: rgba(255,180,60,.4); color: #ffc775; }

  .devices { position: absolute; left: 64px; bottom: 44px; width: 600px; }
  .devices .label {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .2em;
    color: #7f9fb2; text-transform: uppercase; margin-bottom: 14px;
    display: flex; justify-content: space-between;
  }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
  .tile {
    aspect-ratio: 1; border-radius: 16px; position: relative;
    background: rgba(20,40,58,.55); border: 1px solid rgba(120,200,255,.22);
    display: flex; align-items: center; justify-content: center;
  }
  .tile svg { width: 30px; height: 30px; fill: #7fb8d8; }
  .tile.on { background: rgba(255,180,60,.16); border-color: rgba(255,180,60,.5);
             box-shadow: 0 0 22px rgba(255,180,60,.22); }
  .tile.on svg { fill: #ffc775; }
  .tile .bar { position: absolute; left: 10px; right: 10px; bottom: 8px; height: 3px;
               border-radius: 2px; background: rgba(120,200,255,.18); overflow: hidden; }
  .tile .bar::after { content: ''; position: absolute; inset: 0 40% 0 0; background: #ffc775; border-radius: 2px; }
</style>
</head>
