name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Home Assistant and the newest. 2026.3 runs on
        # Python 3.13, so this matrix also stops 3.14-only syntax reaching a
        # release that cannot parse it.
        include:
          - homeassistant: "2026.3.4"
            python: "3.13"
          - homeassistant: "2026.9.2"
            python: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python \
            "homeassistant==${{ matrix.homeassistant }}" \
            pytest-homeassistant-custom-component ruff pillow
          # The panel tests need the frontend the core release pins.
          FRONTEND=$(.venv/bin/python -c "import json, homeassistant.components.frontend as f, pathlib; print(json.loads((pathlib.Path(f.__file__).parent / 'manifest.json').read_text())['requirements'][0])")
          uv pip install --python .venv/bin/python "$FRONTEND"
      - run: .venv/bin/ruff check custom_components/ tests/
      - run: .venv/bin/ruff format --check custom_components/ tests/
      - run: .venv/bin/python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: The committed build is the one this source makes
        # HACS installs what is committed. A build that only exists on
        # somebody's machine, or a stale one, fails here instead.
        run: git diff --exit-code --stat -- ../custom_components/better_wall_dashboard/frontend
      - name: Every shipped script parses
        run: find ../custom_components -name '*.js' -print0 | xargs -0 -n1 node --check
